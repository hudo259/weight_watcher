<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Weight Watcher icon</title>
  <desc id="desc">A glowing W-shaped chain of five data points suspended inside subtle three-dimensional orbital rings.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13233B"/>
      <stop offset="0.55" stop-color="#10192F"/>
      <stop offset="1" stop-color="#1B173A"/>
    </linearGradient>
    <linearGradient id="trajectory" x1="0" y1="0.4" x2="1" y2="0.6">
      <stop offset="0" stop-color="#5EEDDF"/>
      <stop offset="0.46" stop-color="#75BDFB"/>
      <stop offset="1" stop-color="#B99EFF"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60E3E0" stop-opacity="0.10"/>
      <stop offset="0.54" stop-color="#96B9ED" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#BA96FB" stop-opacity="0.14"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="47%" r="55%">
      <stop offset="0" stop-color="#46749C" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#46749C" stop-opacity="0"/>
    </radialGradient>
    <filter id="line-glow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="dot-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="tile"><rect x="12" y="12" width="488" height="488" rx="106"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="12" y="12" width="488" height="488" rx="106" fill="url(#background)"/>
    <circle cx="255" cy="242" r="246" fill="url(#halo)"/>
    <!-- A subtle pair of tilted orbits suggests three-dimensional weight space. -->
    <g fill="none" stroke="url(#orbit)" stroke-width="3.5">
      <ellipse cx="256" cy="255" rx="192" ry="89" transform="rotate(-33 256 255)"/>
      <ellipse cx="256" cy="255" rx="192" ry="89" transform="rotate(33 256 255)" opacity="0.65"/>
    </g>
    <g fill="#8DD9F5">
      <circle cx="87" cy="258" r="5" opacity="0.54"/>
      <circle cx="424" cy="252" r="5" opacity="0.62"/>
      <circle cx="275" cy="100" r="4" opacity="0.38"/>
      <circle cx="270" cy="412" r="4" opacity="0.30"/>
    </g>
    <!-- Five prominent vertices connected by a W-shaped data trajectory. -->
    <path d="M 119 170 L 185 345 L 256 240 L 327 345 L 393 170"
          fill="none" stroke="url(#trajectory)" stroke-width="37"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.56" filter="url(#line-glow)"/>
    <path d="M 119 170 L 185 345 L 256 240 L 327 345 L 393 170"
          fill="none" stroke="url(#trajectory)" stroke-width="23"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 119 170 L 185 345 L 256 240 L 327 345 L 393 170"
          fill="none" stroke="#E8FFFF" stroke-width="3.2"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.30"/>
    <g filter="url(#dot-glow)" opacity="0.47">
      <circle cx="119" cy="170" r="23" fill="#4BEADB"/>
      <circle cx="185" cy="345" r="23" fill="#62CDEC"/>
      <circle cx="256" cy="240" r="23" fill="#83BFFA"/>
      <circle cx="327" cy="345" r="23" fill="#A8A8FF"/>
      <circle cx="393" cy="170" r="23" fill="#BA94FF"/>
    </g>
    <g stroke="#D7F6FF" stroke-opacity="0.55" stroke-width="2">
      <circle cx="119" cy="170" r="15" fill="#52E7DC"/>
      <circle cx="185" cy="345" r="15" fill="#68CDEC"/>
      <circle cx="256" cy="240" r="17" fill="#84C3FA"/>
      <circle cx="327" cy="345" r="15" fill="#A5A7FC"/>
      <circle cx="393" cy="170" r="15" fill="#BD99FF"/>
    </g>
    <g fill="#FFFFFF" opacity="0.80">
      <circle cx="115" cy="165" r="4"/><circle cx="181" cy="340" r="4"/>
      <circle cx="251" cy="234" r="4.5"/><circle cx="323" cy="340" r="4"/>
      <circle cx="388" cy="165" r="4"/>
    </g>
  </g>
  <rect x="12.75" y="12.75" width="486.5" height="486.5" rx="105.25"
        fill="none" stroke="#A9C3F5" stroke-opacity="0.15" stroke-width="1.5"/>
</svg>

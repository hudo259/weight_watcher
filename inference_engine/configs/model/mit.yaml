# Used for both classification and segmentation.
# Task is determined by the argparse subcommand (classification | segmentation).
#
#   Classification:  MiTClassifier
#                    backbone global average pool on last stage LayerNorm linear head
#                    Note: MiT has no built-in classification head — one is added.
#
#   Segmentation:    MiTBackbone wrapped in UperNet
#                    backbone produces [H/4, H/8, H/16, H/32] feature maps
#                    via return_layer_outputs=True
#
# Available variants, change `variant` to swap:
#
#   variant  params   dims                        layers       heads
#   -------  ------   ----                        ------       -----
#   b0         4M     [32,  64, 160, 256]         [2, 2, 2, 2] [1, 2, 5, 8]
#   b1        14M     [64, 128, 320, 512]         [2, 2, 2, 2] [1, 2, 5, 8]
#   b2        25M     [64, 128, 320, 512]         [3, 4, 6, 3] [1, 2, 5, 8]
#   b4        62M     [64, 128, 320, 512]         [3, 8,27, 3] [1, 2, 5, 8]
#
# reduction_ratio per stage: [8, 4, 2, 1]
# Sequence reduction is the key efficiency mechanism. Keys/values are spatially
# downsampled before attention, making early stages tractable at high resolution.

backbone: mit
variant: b2
fpn_channels: 256
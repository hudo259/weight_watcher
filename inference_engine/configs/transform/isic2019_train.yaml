# Reference: Gessert et al., "Skin lesion classification using ensembles of
#            multi-resolution EfficientNets with meta data" (2020)
transforms:
  - _target_: torchvision.transforms.v2.ToImage
  - _target_: torchvision.transforms.v2.RandomRotation
    degrees: 90
  - _target_: torchvision.transforms.v2.RandomResizedCrop
    size: [224, 224]
    scale: [0.6, 1.0]
  - _target_: torchvision.transforms.v2.RandomHorizontalFlip
    p: 0.5
  - _target_: torchvision.transforms.v2.RandomVerticalFlip
    p: 0.5
  - _target_: torchvision.transforms.v2.RandAugment
    num_ops: 2
    magnitude: 9
  #- _target_: torchvision.transforms.v2.ColorJitter
  #  brightness: 0.3
  #  contrast: 0.3
  #  saturation: 0.3
  #  hue: 0.05
  - _target_: torchvision.transforms.v2.ToDtype
    dtype: ${locate:torch.float32}
    scale: True
  - _target_: torchvision.transforms.v2.Normalize
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]
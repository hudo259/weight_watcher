# AdamW optimizer for classification.
# _target_ is instantiated via utils/instantiate.py.
# Keys below backbone_lr_scale are trainer metadata — they are read by
# Trainer._build_schedulers and stripped before passing to AdamW.__init__.

# Values derived from Convnext v2 paper for base model. We use the linear scaling rule for batch size 64

_target_: torch.optim.AdamW
lr: 5.0e-5
weight_decay: 0.05
betas: [0.9, 0.999]
eps: 1.0e-8

# Trainer metadata (not AdamW constructor args):
backbone_lr_scale: 1.0   # backbone LR = lr * scale; set 0.0 to freeze backbone
warmup_epochs: 20
min_lr: 1.0e-6
scheduler: cosine